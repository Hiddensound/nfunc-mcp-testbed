<!DOCTYPE html>
<!--
  USE CASE 1 – WCAG 2.1 Level A violations, scanned against a WCAG 2.1 AA target.
  Every [BUG] below fails a Level A success criterion, so run_accessibility_check
  (default standard WCAG2AA, target_level AA) should price each one as P1 and
  report AA conformance as unreachable. The only Level AA issue on this page is
  the shared footer contrast (P2), which gives the report an A-vs-AA contrast.
-->
<!-- [BUG – WCAG 3.1.1 Language of Page (A)] No lang attribute on <html>. -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- [BUG – WCAG 2.4.2 Page Titled (A)] No <title> element. -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Trailhead Outfitters</a>
    <nav class="site-nav" aria-label="Main">
      <a href="/">Home</a>
      <a href="/products.html">Products</a>
      <a href="/deals.html">Deals</a>
      <!-- [BUG – WCAG 2.4.4 Link Purpose / 4.1.2 Name, Role, Value (A)] Icon-only link with no text. -->
      <a href="/cart" class="cart-link"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="7" cy="17" r="2" fill="#fff"/><circle cx="15" cy="17" r="2" fill="#fff"/><path d="M1 1h3l3 11h10l2-8H6" stroke="#fff" fill="none"/></svg></a>
    </nav>
  </header>

  <main>
    <h1>All products</h1>

    <form class="filters" action="/api/search">
      <!-- [BUG – WCAG 1.3.1 Info and Relationships / 4.1.2 (A)] Text input with only a placeholder, no label. -->
      <input type="text" name="q" placeholder="Search products">

      <!-- [BUG – WCAG 1.3.1 / 4.1.2 (A)] Select with no label. -->
      <select name="sort">
        <option value="price">Price</option>
        <option value="name">Name</option>
      </select>

      <!-- [BUG – WCAG 4.1.2 Name, Role, Value (A)] Button with no accessible name. -->
      <button class="icon-btn" type="submit"></button>
    </form>

    <div class="card-grid">
      <article class="card">
        <!-- [BUG – WCAG 1.1.1 Non-text Content (A)] Image with no alt attribute. -->
        <img src="/images/shoe.svg" width="220" height="140">
        <h3>Trail Runner Shoe</h3>
        <p>$89.00</p>
      </article>
      <article class="card">
        <!-- [BUG – WCAG 1.1.1 (A)] Image with no alt attribute. -->
        <img src="/images/sock.svg" width="220" height="140">
        <h3>Merino Hiking Sock</h3>
        <p>$18.50</p>
      </article>
      <article class="card">
        <!-- [BUG – WCAG 1.1.1 (A)] Image with no alt attribute. -->
        <img src="/images/jacket.svg" width="220" height="140">
        <h3>Packable Rain Shell</h3>
        <p>$129.00</p>
      </article>
      <article class="card">
        <!-- [BUG – WCAG 1.1.1 (A)] Image with no alt attribute. -->
        <img src="/images/bottle.svg" width="220" height="140">
        <h3>Insulated Bottle</h3>
        <p>$32.00</p>
      </article>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Trailhead Outfitters. <a href="/deals.html">Shipping &amp; returns</a></p>
  </footer>
</body>
</html>
